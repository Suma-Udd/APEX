name: Release

# Actions > Release > Run workflow.
#   Version empty  -> test build (same as pushing a build/... branch). Installers show up as artifacts on the run, nothing is published.
#   Version 0.3.0  -> bumps the version, tags v0.3.0, builds Windows + Mac, publishes the release.
#                     Installed apps see it within a few hours (or via Settings > Check for updates).
on:
  # Pushing a branch named build/<anything> makes a test build too.
  push:
    branches: ["build/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, like 0.3.0. Leave empty for a test build"
        required: false
        default: ""
      notes:
        description: "What's new (shown in the app's update popup)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.out.outputs.ref }}
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check inputs
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 0.3.0"; exit 1; fi
          if [ "$HAS_KEY" != "true" ]; then echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repo secret first (Settings > Secrets and variables > Actions)"; exit 1; fi
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null; then echo "::error::v$VERSION already exists"; exit 1; fi
      - name: Bump version and tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION" --repo "$GITHUB_REPOSITORY"
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git commit -am "Release v$VERSION" || echo "version already set"
          git tag "v$VERSION"
          git push origin HEAD:${{ github.ref_name }} "v$VERSION"
      - id: out
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "ref=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"; else echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
          - name: mac
            os: macos-latest   # Apple Silicon
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the Python backend
        run: |
          set -o pipefail
          node scripts/build.mjs --backend 2>&1 | tee -a build.log
      - name: Backend starts and answers
        run: node scripts/smoke-backend.mjs
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No signing key, building without update files (fine for a test build)"
            extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          # hdiutil on GitHub's Macs sometimes says "Resource busy"; one retry fixes it
          set -o pipefail
          { npx tauri build --bundles ${{ matrix.bundles }} "${extra[@]}" || { sleep 10; npx tauri build --bundles ${{ matrix.bundles }} "${extra[@]}"; }; } 2>&1 | tee -a build.log
      - name: Show the error
        if: failure()
        run: |
          # Annotations are readable without logging in, so put the end of the log there.
          [ -f build.log ] && tail -n 25 build.log | sed 's/^/::error::/' || true
      - name: Collect installers
        run: |
          mkdir -p out
          b=src-tauri/target/release/bundle
          if [ "${{ matrix.name }}" = windows ]; then
            cp $b/nsis/*-setup.exe out/APEX-Setup.exe
            [ -f $b/nsis/*-setup.exe.sig ] && cp $b/nsis/*-setup.exe.sig out/APEX-Setup.exe.sig || true
          else
            cp $b/dmg/*.dmg out/APEX-mac-arm64.dmg
            if [ -f $b/macos/APEX.app.tar.gz ]; then
              cp $b/macos/APEX.app.tar.gz out/APEX-mac-arm64.app.tar.gz
              cp $b/macos/APEX.app.tar.gz.sig out/APEX-mac-arm64.app.tar.gz.sig
            fi
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apex-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    if: needs.prepare.outputs.version != ''
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Write update manifest and release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "${NOTES:-Bug fixes and improvements.}" > notes.txt
          node scripts/latest-json.mjs assets "$VERSION" "$GITHUB_REPOSITORY" notes.txt
          {
            cat notes.txt
            echo
            echo "## Install"
            echo
            echo "**Windows:** download \`APEX-Setup.exe\` and run it. If Windows says *Windows protected your PC*, click **More info > Run anyway** (the app isn't signed with a paid certificate)."
            echo
            echo "**Mac (Apple Silicon):** download \`APEX-mac-arm64.dmg\`, open it and drag APEX into Applications. The first time, right click APEX > **Open**. If macOS still blocks it, go to **System Settings > Privacy & Security** and click **Open Anyway**. If it says the app is *damaged*, run \`xattr -cr /Applications/APEX.app\` in Terminal once."
            echo
            echo "Already installed? APEX updates itself, you'll get a popup."
          } > body.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" assets/* --title "APEX $VERSION" --notes-file body.md --latest
