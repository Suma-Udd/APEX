name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          npm ci
          python -m pip install fastapi uvicorn tzdata certifi httpx
      - name: Typecheck and build the UI
        run: |
          npm run typecheck
          npm run build
      - name: Backend starts and answers
        run: node scripts/smoke-backend.mjs --source
      - name: Paper trading tests (orders, stops, margin, risk limits, strategies)
        run: python scripts/test-backend.py backend
      - name: Rust shell compiles
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          mkdir -p src-tauri/binaries && touch src-tauri/binaries/apex-backend-x86_64-unknown-linux-gnu
          cd src-tauri && cargo check --locked
